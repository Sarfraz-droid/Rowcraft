name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      # The Tauri shell needs platform webview libraries; it has its own job.
      - run: cargo clippy --workspace --all-targets --exclude dg-desktop -- -D warnings
      - run: cargo test --workspace --exclude dg-desktop

  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - run: pnpm install --frozen-lockfile
        working-directory: apps/dg-desktop
      - run: pnpm build && pnpm test
        working-directory: apps/dg-desktop
      - run: cargo clippy -p dg-desktop --all-targets -- -D warnings
      - run: cargo test -p dg-desktop
