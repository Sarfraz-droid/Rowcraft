name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  installers:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    defaults:
      run:
        working-directory: apps/rowcraft-desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/rowcraft-desktop/package.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          # Cargo workspace output is at the repository root.
          workspaces: ". -> target"
          key: installers-${{ matrix.target }}
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 rpm lsof xdg-utils
      - name: Check application version
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const app = JSON.parse(readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          if (app.version !== pkg.version) throw new Error('Tauri and package.json versions must match.');
          if (process.env.GITHUB_REF_TYPE === 'tag' && process.env.GITHUB_REF_NAME !== `v${app.version}`) {
            throw new Error(`Release tag must be v${app.version}.`);
          }
          JS
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Check signing environment preparation
        run: node --test ../../.github/scripts/prepare-macos-signing.test.mjs
      - name: Prepare macOS signing
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node ../../.github/scripts/prepare-macos-signing.mjs
      - name: Find existing release
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const { version } = JSON.parse(fs.readFileSync('apps/rowcraft-desktop/src-tauri/tauri.conf.json', 'utf8'));
            const tag = `v${version}`;
            // Include drafts and published releases. Passing the ID lets Tauri
            // upload to either without requiring a matching releaseDraft value.
            for await (const { data: releases } of github.paginate.iterator(
              github.rest.repos.listReleases, { ...context.repo, per_page: 100 }
            )) {
              const release = releases.find(release => release.tag_name === tag);
              if (release) {
                core.setOutput('id', String(release.id));
                break;
              }
            }
      - name: Build installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/rowcraft-desktop
          args: --target ${{ matrix.target }} --ci -- --locked
          # Both manual and tag runs attach installers to the app version's release.
          releaseId: ${{ steps.release.outputs.id }}
          tagName: v__VERSION__
          releaseCommitish: ${{ github.sha }}
          releaseName: Rowcraft v__VERSION__
          releaseBody: Download the installer for your operating system and CPU architecture. See docs/installers.md for installation and signing details.
          releaseDraft: true
          uploadWorkflowArtifacts: true
          uploadUpdaterJson: false
