[workspace]
resolver = "3"
members = ["crates/*", "dialects/*", "wire/*", "apps/rowcraft-cli", "apps/rowcraft-desktop/src-tauri"]

[workspace.package]
version = "0.0.10"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sarfraz-droid/Rowcraft"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"

[workspace.dependencies]
# External
async-trait = "0.1"
webpki-roots = "1"
scylla = { version = "1", default-features = false, features = ["rustls-023", "full-serialization"] }
base64 = "0.22"
bson = { version = "3", features = ["serde_json-1"] }
hmac = "0.12"
sha2 = "0.10"
mongodb = { version = "3", default-features = false, features = ["rustls-tls", "dns-resolver", "compat-3-0-0", "bson-3"] }
chrono = { version = "0.4", default-features = false, features = ["std", "alloc"] }
tiberius = { version = "=0.13.0", default-features = false, features = ["rustls", "tds73", "chrono", "rust_decimal"] }
tokio-util = { version = "0.7", features = ["compat"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "json", "gzip", "query", "form"] }
redis = { version = "=1.7.1", default-features = false, features = ["tokio-comp", "tokio-rustls-comp", "tls-rustls-webpki-roots"] }
mysql_async = { version = "=0.37.1", default-features = false, features = ["minimal-rust", "default-rustls-ring"] }
rusqlite = { version = "0.37", features = ["bundled", "column_decltype"] }
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false }
# Local HTTP API (`rowcraft serve`).
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
# GUI: Tauri shell around a web frontend (SPEC.md §3.1).
tauri = { version = "2", default-features = false, features = ["wry", "compression"] }
tauri-build = { version = "2", features = [] }
# In-app updates from signed GitHub releases (docs/installers.md).
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
russh = { version = "=0.64.1", default-features = false, features = ["flate2", "ring", "rsa"] }
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-postgres = "0.7"
tokio-postgres-rustls = { version = "0.14", features = ["ring", "webpki-roots"] }
toml = "1"

# Internal: core
rowcraft-api = { path = "crates/rowcraft-api" }
rowcraft-cache = { path = "crates/rowcraft-cache" }
rowcraft-config = { path = "crates/rowcraft-config" }
rowcraft-core = { path = "crates/rowcraft-core" }
rowcraft-dialect = { path = "crates/rowcraft-dialect" }
rowcraft-drivers = { path = "crates/rowcraft-drivers" }
rowcraft-grid = { path = "crates/rowcraft-grid" }
rowcraft-io = { path = "crates/rowcraft-io" }
rowcraft-model = { path = "crates/rowcraft-model" }
rowcraft-registry = { path = "crates/rowcraft-registry" }
rowcraft-script = { path = "crates/rowcraft-script" }
rowcraft-sql = { path = "crates/rowcraft-sql" }
rowcraft-ssh = { path = "crates/rowcraft-ssh" }
rowcraft-ui-model = { path = "crates/rowcraft-ui-model" }

# Internal: shared dialect bases
rowcraft-dialect-jdbc = { path = "dialects/jdbc" }
rowcraft-dialect-http = { path = "dialects/http" }
rowcraft-dialect-pgbase = { path = "dialects/pgbase" }
rowcraft-dialect-mysqlbase = { path = "dialects/mysqlbase" }
rowcraft-dialect-pg = { path = "dialects/pg" }
rowcraft-dialect-redshift = { path = "dialects/redshift" }
rowcraft-dialect-greenplum = { path = "dialects/greenplum" }
rowcraft-dialect-cockroach = { path = "dialects/cockroach" }
rowcraft-dialect-mysql = { path = "dialects/mysql" }
rowcraft-dialect-mariadb = { path = "dialects/mariadb" }
rowcraft-dialect-sqlite = { path = "dialects/sqlite" }
rowcraft-dialect-mssql = { path = "dialects/mssql" }
rowcraft-dialect-clickhouse = { path = "dialects/clickhouse" }
rowcraft-dialect-cassandra = { path = "dialects/cassandra" }
rowcraft-dialect-mongo = { path = "dialects/mongo" }
rowcraft-dialect-redis = { path = "dialects/redis" }
rowcraft-dialect-dynamo = { path = "dialects/dynamo" }
rowcraft-dialect-h2 = { path = "dialects/h2" }
rowcraft-dialect-snowflake = { path = "dialects/snowflake" }
rowcraft-dialect-bigquery = { path = "dialects/bigquery" }
rowcraft-dialect-couchbase = { path = "dialects/couchbase" }
rowcraft-dialect-exasol = { path = "dialects/exasol" }
rowcraft-dialect-hive = { path = "dialects/hive" }
rowcraft-dialect-spark = { path = "dialects/spark" }
rowcraft-dialect-vertica = { path = "dialects/vertica" }
rowcraft-dialect-sybase = { path = "dialects/sybase" }
rowcraft-dialect-db2 = { path = "dialects/db2" }
rowcraft-dialect-derby = { path = "dialects/derby" }
rowcraft-dialect-oracle = { path = "dialects/oracle" }
rowcraft-dialect-hsqldb = { path = "dialects/hsqldb" }
rowcraft-dialect-trino = { path = "dialects/trino" }

# Internal: wire protocols
rowcraft-wire-drda = { path = "wire/drda" }
rowcraft-wire-tds5 = { path = "wire/tds5" }
rowcraft-wire-tns = { path = "wire/tns" }
rowcraft-wire-vertica = { path = "wire/vertica" }
rowcraft-wire-exasol = { path = "wire/exasol" }
rowcraft-wire-hs2 = { path = "wire/hs2" }
rowcraft-wire-hsqldb = { path = "wire/hsqldb" }

[profile.dev]
# Full debug info made target/ balloon to ~50 GB; line tables keep backtraces usable.
debug = "line-tables-only"
